name: MuseClone
options:
  bundleIdPrefix: com.example
targets:
  MuseClone:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources
    info:
      path: Info.plist
      properties:
        UILaunchStoryboardName: LaunchScreen
        NSLocationWhenInUseUsageDescription: "Your personal agent requires location access to provide context-aware recommendations."
        NSContactsUsageDescription: "Your personal agent requires contacts access to help you message and email people."
        NSCalendarsFullAccessUsageDescription: "Your personal agent requires calendar access to read your schedule and create events."
        NSCalendarsUsageDescription: "Your personal agent requires calendar access to read your schedule and create events."
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        PRODUCT_NAME: MuseClone
        SWIFT_VERSION: 5.0
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: Citadel
packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    from: 0.7.0
